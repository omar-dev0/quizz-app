name: quizz_app
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.6
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  dio: 
  intl: any
  flutter_bloc: ^8.1.6
  injectable: ^2.5.0
  pretty_dio_logger:
  get_it:
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.0.0
  isar_flutter_libs: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
    # add the generator to your dev_dependencies
# add build runner if not already added
  flutter_lints: ^3.0.0
  isar_generator: ^3.0.0
  build_runner:
  injectable_generator:
  retrofit_generator: '>=8.0.0 <10.0.0' # for Dart 3.3 use ^9.0.0
  json_serializable: ^6.8.0
  hive_generator:


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/animations/
    - assets/images/
